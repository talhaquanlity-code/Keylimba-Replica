<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Keylimba Clone</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://jsdelivr.net"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col items-center justify-center font-sans select-none">

  <!-- Header / Display Area -->
  <header class="text-center mb-8">
    <h1 class="text-4xl font-extrabold text-amber-800 tracking-wide">JS KEYLIMBA</h1>
    <p class="text-amber-600 mt-2 font-medium">Press the keys on your keyboard or click the tines!</p>
    <!-- Visual Note Indicator -->
    <div id="note-display" class="mt-4 text-3xl font-bold text-amber-900 bg-amber-100 px-6 py-2 rounded-full shadow-sm inline-block min-w-[3rem] h-12 transition-all duration-100 scale-100">
      -
    </div>
  </header>

  <!-- Kalimba Body -->
  <main class="bg-amber-700 p-8 pb-4 rounded-3xl shadow-2xl border-4 border-amber-800 flex items-start justify-center gap-1.5 min-h-[350px] max-w-xl w-full mx-4 relative">
    
    <!-- Sound Hole Decor -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-16 h-16 bg-amber-900 rounded-full border-4 border-amber-800 opacity-80 shadow-inner"></div>

    <!-- Tines (Keys) will be generated by JavaScript -->
    <div id="kalimba-tines" class="flex items-start justify-center gap-1 w-full z-10">
      <!-- Dynamic Tines Inserted Here -->
    </div>

  </main>

  <script>
    // 1. Define Kalimba Notes and Keyboard Mappings
    // Arranged from left to right alternating, mimicking a real kalimba layout
    const kalimbaNotes = [
      { note: "D5", key: "a", freq: 587.33, height: "h-48" },
      { note: "B4", key: "s", freq: 493.88, height: "h-52" },
      { note: "G4", key: "d", freq: 392.00, height: "h-56" },
      { note: "E4", key: "f", freq: 329.63, height: "h-60" },
      { note: "C4", key: "g", freq: 261.63, height: "h-64" }, // Center lowest note
      { note: "D4", key: "h", freq: 293.66, height: "h-62" },
      { note: "F4", key: "j", freq: 349.23, height: "h-58" },
      { note: "A4", key: "k", freq: 440.00, height: "h-54" },
      { note: "C5", key: "l", freq: 523.25, height: "h-50" },
    ];

    // 2. Initialize Web Audio API (Synthesizing sounds so you don't need external audio files)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
    }

    function playTone(freq) {
      initAudio();
      
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      // Sine wave gives a clean, bell-like tone close to a kalimba
      oscillator.type = 'sine'; 
      oscillator.frequency.value = freq;

      // Create a plucking sound profile (fast attack, gradual decay)
      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.01);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 0.8);
    }

    // 3. Render Tines Dynamically using Tailwind CSS classes
    const tinesContainer = document.getElementById("kalimba-tines");
    const noteDisplay = document.getElementById("note-display");

    kalimbaNotes.forEach(item => {
      const tine = document.createElement("div");
      tine.id = `tine-${item.key}`;
      
      // Tailwind classes for styling the metal tines
      tine.className = `
        ${item.height} flex-1 bg-gradient-to-b from-slate-300 via-slate-400 to-slate-200 
        rounded-b-2xl border-x border-b border-slate-500 shadow-md 
        flex flex-col justify-end items-center pb-4 cursor-pointer 
        transition-all duration-75 origin-top transform active:scale-y-95 active:brightness-90
      `;

      tine.innerHTML = `
        <span class="text-xs font-bold text-slate-700 tracking-tighter uppercase">${item.note}</span>
        <span class="text-[10px] font-medium text-slate-500 uppercase mt-1 bg-slate-100 px-1 rounded">${item.key}</span>
      `;

      // Mouse/Touch Interaction Event
      tine.addEventListener("mousedown", () => triggerNote(item));
      tine.addEventListener("touchstart", (e) => {
        e.preventDefault(); // Prevents double-triggering on mobile devices
        triggerNote(item);
      });

      tinesContainer.appendChild(tine);
    });

    // 4. Core Logic Action Function
    function triggerNote(item) {
      // Play Audio
      playTone(item.freq);

      // Update Screen Display Text
      noteDisplay.innerText = item.note;
      
      // UI Animation: Pop the note display
      noteDisplay.classList.remove("scale-100");
      noteDisplay.classList.add("scale-110", "bg-amber-200");
      setTimeout(() => {
        noteDisplay.classList.remove("scale-110", "bg-amber-200");
        noteDisplay.classList.add("scale-100");
      }, 100);

      // UI Animation: Visual key press feedback
      const tineElement = document.getElementById(`tine-${item.key}`);
      tineElement.classList.add("translate-y-2", "brightness-90");
      setTimeout(() => {
        tineElement.classList.remove("translate-y-2", "brightness-90");
      }, 100);
    }

    // 5. JavaScript Keyboard Event Listeners
    window.addEventListener("keydown", (event) => {
      // Avoid tracking holding down keys continuously
      if (event.repeat) return; 

      const lowerKey = event.key.toLowerCase();
      const matchedNote = kalimbaNotes.find(item => item.key === lowerKey);

      if (matchedNote) {
        triggerNote(matchedNote);
      }
    });
  </script>
</body>
</html>
